name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Builds on the version `rust-version` claims, so the claim is tested
      # rather than asserted.
      - run: cargo build

  fixtures:
    name: fixtures behave as documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2

      # The crash fixture must actually crash in Node, and the benign one
      # must actually run. Without this, a "crash" verdict is just an
      # assertion agreeing with itself.
      - name: node proves the crash fixture throws
        run: node tests/fixtures/crashing-cycle/verify.mjs
      - name: node proves the benign fixture runs
        run: node tests/fixtures/benign-cycle/verify.mjs

      - run: cargo build --release

      # The tool must stay completely silent about a correct project, at
      # every severity. A rule that fires on the correct example fires
      # everywhere.
      - name: clean project produces no findings
        run: ./target/release/overpull check --root tests/fixtures/clean-project --fail-on any

      - name: crashing cycle fails the build
        run: |
          if ./target/release/overpull cycles --root tests/fixtures/crashing-cycle; then
            echo "expected a non-zero exit for a crashing cycle"
            exit 1
          fi

      - name: benign cycle does not fail the build
        run: ./target/release/overpull cycles --root tests/fixtures/benign-cycle

  dogfood:
    name: analyse a real project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: clone vuejs/core
        run: git clone --depth 1 https://github.com/vuejs/core /tmp/vue-core
      # Not a pass/fail gate on Vue's code — a smoke test that the analyser
      # survives a large real graph and emits valid JSON.
      - name: check runs and emits valid JSON
        run: |
          ./target/release/overpull check --root /tmp/vue-core --json --fail-on never > /tmp/out.json
          python3 -c "import json,sys; json.load(open('/tmp/out.json'))"
          echo "modules analysed OK"
