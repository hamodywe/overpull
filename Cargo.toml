[package]
name = "overpull"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Measures what your imports really load: module-graph cost, barrel-file amplification, and the import cycles that compile clean and crash at runtime."
license = "MIT"
repository = "https://github.com/hamodywe/overpull"
homepage = "https://github.com/hamodywe/overpull"
documentation = "https://github.com/hamodywe/overpull#readme"
readme = "README.md"
keywords = ["typescript", "import-graph", "barrel-files", "circular-dependency", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs", "/examples", "/tests/fixtures", "/.githooks", "/scripts", "/.cirrus.yml"]

[dependencies]
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_parser = "0.144.0"
oxc_resolver = "11.24.2"
oxc_semantic = "0.144.0"
oxc_span = "0.144.0"
oxc_syntax = "0.144.0"
rayon = "1.12.0"
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
# Report building reads better as `push_str(&format!(...))` than as `write!`
# with an unwrap or a discarded Result on every line.
format_push_string = "allow"
